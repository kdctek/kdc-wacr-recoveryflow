name: Deploy to WordPress.org

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Plugin version to deploy (for example 0.1.5)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy plugin and assets
    runs-on: ubuntu-latest
    env:
      SVN_URL: https://plugins.svn.wordpress.org/kdc-wacr-recoveryflow
      PLUGIN_SLUG: kdc-wacr-recoveryflow

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if [ -z "$VERSION" ]; then
            echo "Version is required"
            exit 1
          fi

          HEADER_VERSION="$(sed -n 's/^ *\* Version:[[:space:]]*//p' kdc-wacr-recoveryflow.php | head -n1 | tr -d '\r')"
          README_VERSION="$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt | head -n1 | tr -d '\r')"

          if [ "$HEADER_VERSION" != "$VERSION" ]; then
            echo "Plugin header version is $HEADER_VERSION, expected $VERSION"
            exit 1
          fi

          if [ "$README_VERSION" != "$VERSION" ]; then
            echo "Stable tag is $README_VERSION, expected $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Subversion
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Check out WordPress.org SVN
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          set -euo pipefail

          svn checkout "$SVN_URL" svn \
            --username "$SVN_USERNAME" \
            --password "$SVN_PASSWORD" \
            --non-interactive \
            --trust-server-cert

      - name: Build trunk from the Git release
        shell: bash
        run: |
          set -euo pipefail

          rm -rf svn/trunk
          mkdir -p svn/trunk

          rsync -a --delete \
            --exclude-from=.distignore \
            --exclude='.wordpress-org/' \
            --exclude='.git/' \
            --exclude='svn/' \
            ./ svn/trunk/

      - name: Sync WordPress.org assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p svn/assets

          # Remove the old local asset files but keep the SVN working-copy metadata.
          find svn/assets -type f -delete

          cp .wordpress-org/banner-1544x500.png svn/assets/
          cp .wordpress-org/banner-772x250.png svn/assets/
          cp .wordpress-org/icon-128x128.png svn/assets/
          cp .wordpress-org/icon-256x256.png svn/assets/
          cp .wordpress-org/icon-512x512.png svn/assets/
          cp .wordpress-org/icon.svg svn/assets/

          find .wordpress-org -maxdepth 1 -type f -name 'screenshot-*.png' -exec cp {} svn/assets/ \;

          echo "Assets prepared locally:"
          find svn/assets -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Commit trunk
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          cd svn

          svn add --force trunk >/dev/null

          echo "SVN trunk status:"
          svn status trunk

          if [ -n "$(svn status --quiet trunk)" ]; then
            svn commit trunk \
              -m "Release ${VERSION}" \
              --username "$SVN_USERNAME" \
              --password "$SVN_PASSWORD" \
              --non-interactive \
              --trust-server-cert
          else
            echo "No trunk changes to commit."
          fi

      - name: Commit WordPress.org assets
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          cd svn

          # Explicitly add the asset files. This is intentionally separate from
          # trunk so an empty /assets repository cannot be hidden by trunk status.
          svn add --force assets/*.png >/dev/null

          echo "SVN asset status:"
          svn status assets

          if [ -n "$(svn status --quiet assets)" ]; then
            svn commit assets \
              -m "Sync WordPress.org assets for ${VERSION}" \
              --username "$SVN_USERNAME" \
              --password "$SVN_PASSWORD" \
              --non-interactive \
              --trust-server-cert
          else
            echo "No asset changes to commit."
          fi

      - name: Verify WordPress.org assets
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          echo "Remote WordPress.org assets:"
          svn list "$SVN_URL/assets/" \
            --username "$SVN_USERNAME" \
            --password "$SVN_PASSWORD" \
            --non-interactive \
            --trust-server-cert

          expected_assets=(
            "banner-1544x500.png"
            "banner-772x250.png"
            "icon-128x128.png"
            "icon-256x256.png"
            "icon-512x512.png"
            "icon.svg"
          )

          for asset in "${expected_assets[@]}"; do
            if ! svn list "$SVN_URL/assets/$asset" \
              --username "$SVN_USERNAME" \
              --password "$SVN_PASSWORD" \
              --non-interactive \
              --trust-server-cert >/dev/null 2>&1; then
              echo "ERROR: Missing remote WordPress.org asset: $asset"
              exit 1
            fi
          done

          for asset in .wordpress-org/screenshot-*.png; do
            [ -e "$asset" ] || continue
            filename="${asset##*/}"

            if ! svn list "$SVN_URL/assets/$filename" \
              --username "$SVN_USERNAME" \
              --password "$SVN_PASSWORD" \
              --non-interactive \
              --trust-server-cert >/dev/null 2>&1; then
              echo "ERROR: Missing remote WordPress.org screenshot: $filename"
              exit 1
            fi
          done

          echo "All expected WordPress.org assets are present remotely."

      - name: Verify WordPress.org trunk
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Remote WordPress.org trunk:"
          svn list "$SVN_URL/trunk/" \
            --username "$SVN_USERNAME" \
            --password "$SVN_PASSWORD" \
            --non-interactive \
            --trust-server-cert

          if ! svn list "$SVN_URL/trunk/kdc-wacr-recoveryflow.php" \
            --username "$SVN_USERNAME" \
            --password "$SVN_PASSWORD" \
            --non-interactive \
            --trust-server-cert >/dev/null 2>&1; then
            echo "ERROR: Plugin main file is missing from remote WordPress.org trunk."
            exit 1
          fi

          echo "WordPress.org trunk is populated."

      - name: Create WordPress.org SVN tag
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          cd svn

          if svn list "$SVN_URL/tags/${VERSION}" \
            --username "$SVN_USERNAME" \
            --password "$SVN_PASSWORD" \
            --non-interactive \
            --trust-server-cert >/dev/null 2>&1; then
            echo "SVN tag ${VERSION} already exists; leaving it unchanged."
            exit 0
          fi

          svn copy trunk "$SVN_URL/tags/${VERSION}" \
            -m "Tag ${VERSION}" \
            --username "$SVN_USERNAME" \
            --password "$SVN_PASSWORD" \
            --non-interactive \
            --trust-server-cert

      - name: Deployment summary
        run: |
          echo "Deployed RecoveryFlow by WA.cr ${{ steps.version.outputs.version }}"
          echo "SVN: https://plugins.svn.wordpress.org/kdc-wacr-recoveryflow"
          echo "Plugin: https://wordpress.org/plugins/kdc-wacr-recoveryflow/"
