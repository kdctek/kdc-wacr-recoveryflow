name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  smoke:
    name: Smoke (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.0', '8.3' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint every PHP file
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Smoke tests
        run: php tests/smoke.php

  standards:
    name: Coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
      - uses: ramsey/composer-install@v3
      - name: PHPCS
        run: composer lint
      - name: PHPStan
        run: composer analyse
      # The DDL is asserted as text elsewhere; this asserts the code agrees
      # with it. A dropped or renamed column otherwise stays green through
      # every gate and fails as a runtime SQL error on the first checkout.
      - name: Schema and repositories agree
        run: composer schema:audit

      # What ships is decided by .distignore, which is a deny-list: a new
      # top-level directory ships by accident, and a newly-ignored one vanishes
      # silently. Both have nearly happened here -- assets/ holds the checkout
      # script and is deliberately NOT ignored. This also catches a release
      # whose six version strings have drifted apart, which no other gate sees
      # and which WordPress.org rejects or serves wrongly.
      - name: The zip carries what it must and nothing it must not
        run: composer dist:check

  i18n:
    name: Translation readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      # Catches a string that reaches a person untranslated. Nothing at runtime
      # ever surfaces one, so this is the only place it can be caught.
      - name: Audit every shipped string
        run: php tests/i18n-audit.php
      # A .pot that has drifted from the source is a set of strings no
      # translator has been given the chance to translate.
      - name: Check the .pot is current
        run: bin/i18n.sh --check

  # There is deliberately NO PHPUnit job here. tests/unit, tests/integration,
  # tests/security and tests/failure are empty, and `phpunit --testsuite unit`
  # reports "No tests executed!" and exits 0 -- so a job named "Unit tests" put
  # a green tick claiming coverage on every run for five slices. A gate that
  # checks nothing is worse than no gate: it is read as an answer.
  #
  # Put the job back when the first PHPUnit test is written. tests/smoke.php
  # asserts that the two stay in step, in both directions, so neither this
  # comment nor the empty suites can quietly stop being true.

  accessibility:
    name: Accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Install tooling
        run: npm ci

      # wp-env brings up a real WordPress with this plugin and WooCommerce on
      # it. The run needs one: every screen is behind a capability check, and
      # three of them -- one recovery, one workflow's editor and the public
      # opt-out page -- have no address at all until something exists to
      # address.
      - name: Start WordPress
        run: npm run env:start

      # Recovery is off by default, which is the right default and the wrong
      # state to check: with it off, nothing enrols and the queue renders its
      # empty state. Turning it on is part of arranging the site, not part of
      # what is being tested.
      - name: Turn recovery on
        run: |
          npx wp-env run cli wp rewrite structure '/%postname%/' --hard
          npx wp-env run cli wp eval 'update_option( "recoveryflow_settings", array_merge( (array) get_option( "recoveryflow_settings", array() ), array( "enabled" => true ) ) );'

      # The gate is WCAG 2.2 AA over every screen. The same command then runs
      # the screens again at AAA and prints the findings without failing on
      # them: AAA on core WordPress's own components is not something this
      # plugin can fix, and a gate that can never go green gets switched off.
      - name: WCAG 2.2 AA over every screen
        run: npm run a11y

      # What the document scan cannot see. A control that takes focus while
      # invisible is perfectly good markup.
      - name: Keyboard pass
        run: npm run a11y:keyboard

      - name: What the AAA pass found
        if: always()
        run: RECOVERYFLOW_A11Y_AAA_JSON=aaa.json npm run a11y > /dev/null && echo "AAA results in aaa.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-aaa
          path: aaa.json
          if-no-files-found: ignore
